<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" version="1.1">
  <defs>
    <!-- Градиенты для глубины и голубых теней -->
    <linearGradient id="floorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8aa8f" />
      <stop offset="70%" stop-color="#8f7a5c" />
      <stop offset="100%" stop-color="#6b5b45" />
    </linearGradient>
    <linearGradient id="leftWallGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#d8cfc0" />
      <stop offset="100%" stop-color="#b3a68f" />
    </linearGradient>
    <linearGradient id="rightWallGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#e5ddcf" />
      <stop offset="100%" stop-color="#c8bbaa" />
    </linearGradient>
    <!-- Голубоватый фильтр для теней -->
    <filter id="blueShadow" x="-0.5" y="-0.5" width="2" height="2">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#6a8c9f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Фон (дальняя стена и перспектива) -->
  <rect width="400" height="400" fill="#d6c9b8" />
  
  <!-- Линия горизонта и точка схода (смещена вправо для перспективы 75/25) -->
  <line x1="0" y1="300" x2="400" y2="300" stroke="#9b8468" stroke-width="1" opacity="0.3" />

  <!-- Левая стена (25%) с перспективой -->
  <polygon points="0,0 130,120 130,330 0,400" fill="url(#leftWallGradient)" />
  
  <!-- Правая стена (75%) с перспективой -->
  <polygon points="400,0 130,120 130,330 400,380" fill="url(#rightWallGradient)" />
  
  <!-- Пол (паркетный, с легкой текстурой) -->
  <polygon points="0,400 130,330 400,380 400,400" fill="url(#floorGradient)" />
  <line x1="150" y1="340" x2="390" y2="365" stroke="#a79174" stroke-width="1" opacity="0.3" />
  <line x1="170" y1="350" x2="390" y2="370" stroke="#a79174" stroke-width="1" opacity="0.3" />

  <!-- КАМИН НА ЛЕВОЙ СТЕНЕ (видна половина) -->
  <polygon points="20,180 90,200 85,290 15,270" fill="#b87333" stroke="#5e3e2b" stroke-width="2" /> <!-- Основание -->
  <polygon points="30,150 80,165 78,190 28,175" fill="#a0522d" stroke="#5e3e2b" stroke-width="2" /> <!-- Верхняя часть -->
  <rect x="40" y="200" width="30" height="55" fill="#2a1e14" opacity="0.8" transform="skewY(-5)" /> <!-- Топка -->
  <circle cx="55" cy="225" r="8" fill="#b35e3a" filter="url(#blueShadow)" /> <!-- Огонь (оранжевый, но с голубой тенью) -->
  
  <!-- ПРАВАЯ СТЕНА: два окна с полукруглым верхом -->
  <!-- Первое окно (ближе к углу) -->
  <path d="M200 160 L200 130 Q210 110 235 110 L235 140 Q225 135 215 150 L215 180 Q210 175 200 160" fill="#c9e0e8" stroke="#7d6b5d" stroke-width="2" filter="url(#blueShadow)" />
  <!-- Рама окна -->
  <line x1="217" y1="115" x2="217" y2="155" stroke="#7d6b5d" stroke-width="1.5" />
  <line x1="200" y1="135" x2="235" y2="140" stroke="#7d6b5d" stroke-width="1.5" />
  
  <!-- Второе окно (дальше) -->
  <path d="M280 190 L280 150 Q290 130 320 130 L320 170 Q305 165 295 185 L295 215 Q285 205 280 190" fill="#b5d3e0" stroke="#7d6b5d" stroke-width="2" filter="url(#blueShadow)" />
  <line x1="300" y1="135" x2="300" y2="180" stroke="#7d6b5d" stroke-width="1.5" />
  <line x1="280" y1="165" x2="320" y2="170" stroke="#7d6b5d" stroke-width="1.5" />

  <!-- СТОЛЫ И ДИВАНЫ (коричневая кожа, красноватые элементы) -->

  <!-- Стол 1 (центральный, с чайником) -->
  <ellipse cx="200" cy="270" rx="45" ry="18" fill="#b08968" stroke="#5e3e2b" stroke-width="2" filter="url(#blueShadow)" /> <!-- Столешница -->
  <rect x="190" y="270" width="20" height="40" fill="#b87333" stroke="#5e3e2b" stroke-width="1.5" /> <!-- Ножка -->
  <!-- Чайник на центральном столе -->
  <ellipse cx="200" cy="260" rx="12" ry="8" fill="#b04e3a" stroke="#5e3e2b" stroke-width="1.5" /> <!-- Основание -->
  <rect x="194" y="245" width="12" height="18" fill="#b04e3a" stroke="#5e3e2b" stroke-width="1.5" /> <!-- Корпус -->
  <path d="M200 245 Q205 235 212 238" stroke="#5e3e2b" stroke-width="1.5" fill="none" /> <!-- Носик -->
  <circle cx="200" cy="242" r="3" fill="#5e3e2b" /> <!-- Ручка сверху -->

  <!-- Диван за центральным столом (коричневая кожа) -->
  <polygon points="155,250 245,265 240,310 150,290" fill="#8b5a2b" stroke="#4a2c1a" stroke-width="2" filter="url(#blueShadow)" /> <!-- Спинка -->
  <rect x="160" y="280" width="75" height="25" fill="#a0522d" stroke="#4a2c1a" stroke-width="1.5" transform="skewX(-3)" /> <!-- Сиденье -->
  <!-- Красноватые подлокотники -->
  <rect x="150" y="270" width="12" height="30" fill="#b85c3a" stroke="#4a2c1a" stroke-width="1.5" transform="skewY(-3)" />
  <rect x="232" y="280" width="12" height="30" fill="#b85c3a" stroke="#4a2c1a" stroke-width="1.5" transform="skewY(-3)" />

  <!-- Стол 2 (ближе к окнам, справа) -->
  <ellipse cx="300" cy="310" rx="40" ry="15" fill="#b08968" stroke="#5e3e2b" stroke-width="2" filter="url(#blueShadow)" />
  <rect x="292" y="310" width="16" height="35" fill="#b87333" stroke="#5e3e2b" stroke-width="1.5" />
  <!-- Диван у стола 2 -->
  <polygon points="270,295 330,305 325,340 265,325" fill="#8b5a2b" stroke="#4a2c1a" stroke-width="2" filter="url(#blueShadow)" />
  <rect x="277" y="315" width="48" height="20" fill="#a0522d" stroke="#4a2c1a" stroke-width="1.5" transform="skewX(-2)" />
  <rect x="267" y="310" width="10" height="30" fill="#b85c3a" stroke="#4a2c1a" stroke-width="1.5" transform="skewY(-2)" />

  <!-- Стол 3 (ближе к камину, слева) -->
  <ellipse cx="100" cy="320" rx="35" ry="12" fill="#b08968" stroke="#5e3e2b" stroke-width="2" filter="url(#blueShadow)" />
  <rect x="92" y="320" width="16" height="30" fill="#b87333" stroke="#5e3e2b" stroke-width="1.5" />
  <!-- Диван у стола 3 (кожаный, с красноватыми элементами) -->
  <polygon points="70,305 130,315 125,350 65,335" fill="#8b5a2b" stroke="#4a2c1a" stroke-width="2" filter="url(#blueShadow)" />
  <rect x="77" y="325" width="48" height="18" fill="#a0522d" stroke="#4a2c1a" stroke-width="1.5" transform="skewX(-2)" />
  <rect x="67" y="320" width="10" height="28" fill="#b85c3a" stroke="#4a2c1a" stroke-width="1.5" transform="skewY(-2)" />

  <!-- Голубоватые тени на полу и стенах (накладываются поверх) -->
  <rect width="400" height="400" fill="#6a8c9f" opacity="0.1" />
  <circle cx="250" cy="200" r="100" fill="#5b7e91" opacity="0.1" filter="url(#blueShadow)" />
  
  <!-- Детали: красноватые элементы на стенах (неотделанные) -->
  <line x1="150" y1="120" x2="170" y2="125" stroke="#b85c3a" stroke-width="3" opacity="0.6" />
  <line x1="50" y1="280" x2="80" y2="285" stroke="#b85c3a" stroke-width="3" opacity="0.6" />
  <rect x="350" y="150" width="15" height="10" fill="#b85c3a" opacity="0.5" transform="skewY(-10)" />
</svg>