<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" version="1.1">
  <defs>
    <!-- Градиенты для глубины и атмосферы -->
    <linearGradient id="wallGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b59d7a" />
      <stop offset="100%" stop-color="#8b6f4c" />
    </linearGradient>
    <linearGradient id="floorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5d4a32" />
      <stop offset="100%" stop-color="#3a2e1f" />
    </linearGradient>
    <radialGradient id="lanternGlow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ffdd99" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#cc8844" stop-opacity="0.6" />
    </radialGradient>
    <!-- Фильтр для дождя (размытие и прозрачность) -->
    <filter id="rainFilter" x="-0.5" y="-0.5" width="2" height="2">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" />
    </filter>
  </defs>

  <!-- Фон (стена с текстурой дерева/бамбука) -->
  <rect width="400" height="400" fill="#c8b094" />
  
  <!-- Линии текстуры стен (горизонтальные, с перспективным схождением) -->
  <line x1="0" y1="100" x2="400" y2="100" stroke="#a6896b" stroke-width="2" />
  <line x1="0" y1="170" x2="400" y2="170" stroke="#a6896b" stroke-width="2" />
  <line x1="0" y1="240" x2="400" y2="240" stroke="#a6896b" stroke-width="2" />
  <line x1="0" y1="310" x2="400" y2="310" stroke="#a6896b" stroke-width="2" />

  <!-- Пол (темный паркет) -->
  <polygon points="0,400 0,350 400,300 400,400" fill="url(#floorGradient)" />
  
  <!-- ОКНО (центр, вид на дождь) -->
  <rect x="130" y="60" width="140" height="200" fill="#1a2f3f" stroke="#5d4a32" stroke-width="6" /> <!-- Темный фон окна -->
  <!-- Рамы окна (переплет) -->
  <line x1="200" y1="60" x2="200" y2="260" stroke="#5d4a32" stroke-width="3" />
  <line x1="130" y1="150" x2="270" y2="150" stroke="#5d4a32" stroke-width="3" />
  
  <!-- ДОЖДЬ (линии и капли) с фильтром -->
  <g filter="url(#rainFilter)" opacity="0.6">
    <!-- Линии дождя (наклонные) -->
    <line x1="150" y1="70" x2="140" y2="120" stroke="#b0d0e8" stroke-width="1.5" />
    <line x1="180" y1="80" x2="170" y2="140" stroke="#b0d0e8" stroke-width="1.5" />
    <line x1="210" y1="65" x2="200" y2="130" stroke="#b0d0e8" stroke-width="1.5" />
    <line x1="240" y1="85" x2="230" y2="150" stroke="#b0d0e8" stroke-width="1.5" />
    <line x1="160" y1="150" x2="150" y2="200" stroke="#b0d0e8" stroke-width="1.5" />
    <line x1="190" y1="140" x2="180" y2="210" stroke="#b0d0e8" stroke-width="1.5" />
    <line x1="220" y1="155" x2="210" y2="220" stroke="#b0d0e8" stroke-width="1.5" />
    <line x1="250" y1="130" x2="240" y2="190" stroke="#b0d0e8" stroke-width="1.5" />
    <!-- Капли дождя (круги) -->
    <circle cx="170" cy="100" r="2" fill="#b0d0e8" />
    <circle cx="200" cy="120" r="2" fill="#b0d0e8" />
    <circle cx="230" cy="90" r="2" fill="#b0d0e8" />
    <circle cx="185" cy="180" r="2" fill="#b0d0e8" />
    <circle cx="215" cy="200" r="2" fill="#b0d0e8" />
  </g>

  <!-- БАРНАЯ СТОЙКА (слева) -->
  <polygon points="0,200 80,180 80,330 0,350" fill="#6b4f32" stroke="#3a2e1f" stroke-width="3" /> <!-- Основная часть -->
  <rect x="10" y="210" width="50" height="100" fill="#8b6f4c" stroke="#3a2e1f" stroke-width="2" /> <!-- Фасад -->
  <!-- Столешница стойки -->
  <polygon points="0,190 90,170 90,190 0,210" fill="#a0522d" stroke="#3a2e1f" stroke-width="2" />
  <!-- Элементы декора на стойке (бутылки/кружки) -->
  <rect x="20" y="170" width="8" height="25" fill="#b87333" stroke="#3a2e1f" stroke-width="1" />
  <circle cx="24" cy="170" r="4" fill="#b87333" stroke="#3a2e1f" stroke-width="1" />
  <rect x="40" y="165" width="8" height="25" fill="#8b5a2b" stroke="#3a2e1f" stroke-width="1" />
  <circle cx="44" cy="165" r="4" fill="#8b5a2b" stroke="#3a2e1f" stroke-width="1" />

  <!-- ПОДВЕСНЫЕ ФОНАРИ (два ряда по 4 штуки, уходящие к окну) -->
  <!-- Левый ряд (ближе к камере) -->
  <g>
    <!-- Фонарь 1 (ближний) -->
    <circle cx="70" cy="70" r="15" fill="url(#lanternGlow)" stroke="#b87c3a" stroke-width="2" />
    <line x1="70" y1="55" x2="70" y2="40" stroke="#b87c3a" stroke-width="2" /> <!-- Подвес -->
    <!-- Фонарь 2 -->
    <circle cx="110" cy="100" r="14" fill="url(#lanternGlow)" stroke="#b87c3a" stroke-width="2" />
    <line x1="110" y1="86" x2="110" y2="70" stroke="#b87c3a" stroke-width="2" />
    <!-- Фонарь 3 -->
    <circle cx="150" cy="130" r="13" fill="url(#lanternGlow)" stroke="#b87c3a" stroke-width="2" />
    <line x1="150" y1="117" x2="150" y2="100" stroke="#b87c3a" stroke-width="2" />
    <!-- Фонарь 4 (ближе к окну) -->
    <circle cx="190" cy="160" r="12" fill="url(#lanternGlow)" stroke="#b87c3a" stroke-width="2" />
    <line x1="190" y1="148" x2="190" y2="130" stroke="#b87c3a" stroke-width="2" />
  </g>
  
  <!-- Правый ряд (ближе к камере) -->
  <g>
    <!-- Фонарь 1 (ближний) -->
    <circle cx="330" cy="70" r="15" fill="url(#lanternGlow)" stroke="#b87c3a" stroke-width="2" />
    <line x1="330" y1="55" x2="330" y2="40" stroke="#b87c3a" stroke-width="2" />
    <!-- Фонарь 2 -->
    <circle cx="290" cy="100" r="14" fill="url(#lanternGlow)" stroke="#b87c3a" stroke-width="2" />
    <line x1="290" y1="86" x2="290" y2="70" stroke="#b87c3a" stroke-width="2" />
    <!-- Фонарь 3 -->
    <circle cx="250" cy="130" r="13" fill="url(#lanternGlow)" stroke="#b87c3a" stroke-width="2" />
    <line x1="250" y1="117" x2="250" y2="100" stroke="#b87c3a" stroke-width="2" />
    <!-- Фонарь 4 (ближе к окну) -->
    <circle cx="210" cy="160" r="12" fill="url(#lanternGlow)" stroke="#b87c3a" stroke-width="2" />
    <line x1="210" y1="148" x2="210" y2="130" stroke="#b87c3a" stroke-width="2" />
  </g>

  <!-- Небольшая тень под фонарями на стене -->
  <ellipse cx="70" cy="90" rx="18" ry="6" fill="#1a1a1a" opacity="0.2" />
  <ellipse cx="110" cy="120" rx="16" ry="5" fill="#1a1a1a" opacity="0.2" />
  <ellipse cx="150" cy="150" rx="15" ry="5" fill="#1a1a1a" opacity="0.2" />
  <ellipse cx="190" cy="180" rx="14" ry="5" fill="#1a1a1a" opacity="0.2" />
  <ellipse cx="330" cy="90" rx="18" ry="6" fill="#1a1a1a" opacity="0.2" />
  <ellipse cx="290" cy="120" rx="16" ry="5" fill="#1a1a1a" opacity="0.2" />
  <ellipse cx="250" cy="150" rx="15" ry="5" fill="#1a1a1a" opacity="0.2" />
  <ellipse cx="210" cy="180" rx="14" ry="5" fill="#1a1a1a" opacity="0.2" />

  <!-- Азиатские элементы декора (иероглифы/веера) на стенах -->
  <text x="300" y="220" font-family="serif" font-size="18" fill="#b85c3a" opacity="0.7">竜</text>
  <path d="M60,280 Q70,270 80,280 Q85,290 70,295 Q55,290 60,280" fill="#b85c3a" opacity="0.5" stroke="#5e3e2b" stroke-width="1" />
  <circle cx="340" cy="250" r="12" fill="none" stroke="#b85c3a" stroke-width="2" opacity="0.5" stroke-dasharray="3,2" />

  <!-- Отражение фонарей на мокром полу (легкое свечение) -->
  <ellipse cx="70" cy="360" rx="15" ry="5" fill="#ffdd99" opacity="0.2" filter="url(#rainFilter)" />
  <ellipse cx="330" cy="360" rx="15" ry="5" fill="#ffdd99" opacity="0.2" filter="url(#rainFilter)" />
</svg>